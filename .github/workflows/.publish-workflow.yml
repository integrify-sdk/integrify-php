name: Publish

# Publishing PHP packages works nothing like PyPI.
#
# You never upload a build artefact. Packagist reads a Git repository, takes the
# `composer.json` at its ROOT, and derives available versions from that repo's Git
# tags. Because it only ever looks at the root, one repository can expose exactly
# one Composer package — a monorepo cannot publish two packages by itself.
#
# The standard answer (Symfony, Laravel, Filament all do this) is a "subtree split":
# CI copies each package directory into its own read-only mirror repository, where
# its composer.json sits at the root. Those mirrors are what Packagist watches.
#
#   integrify-php (this repo, where you work)
#   ├── packages/core  ──split──▶  integrify-sdk/integrify-core-php  ──▶ integrify/core
#   └── packages/lsim  ──split──▶  integrify-sdk/integrify-lsim-php  ──▶ integrify/lsim
#
# You never commit to the mirrors by hand. This workflow replaces each mirror's
# working tree from its package directory and pushes normally (no force), so a mirror
# with branch protection on `main` will reject it.
#
# NOTHING HERE LISTS THE PACKAGES. `bin/packages.php` discovers them from
# `packages/*/composer.json`, and the split matrix is built from its JSON output, so
# adding an integration needs no edit to this file. The naming convention is:
#
#   packages/lsim/  ->  integrify/lsim  ->  integrify-sdk/integrify-lsim-php
#
# To override a mirror name or keep a package unpublished, put it in that package's
# own composer.json:
#
#   "extra": {"integrify": {"mirror": "other-name", "publish": false}}
#
# TRIGGERS
#   push to main          -> keep the mirrors' `main` branch in sync (no release)
#   tag `<package>-<ver>` -> verify, test, then split AND push the version tag,
#                            which is what actually publishes a new version
#
#   core-0.1.0  -> publishes integrify/core 0.1.0
#   lsim-0.1.0  -> publishes integrify/lsim 0.1.0
#
# Note the tag is renamed on the way out: the mirror gets `0.1.0`, not `lsim-0.1.0`,
# because Packagist parses the mirror's tag as the version number.
#
# SETUP: see PUBLISHING.md. In short you need one mirror repository per package and a
# repo secret `SPLIT_TOKEN` carrying `Contents: Read and write` on the mirrors only —
# the default GITHUB_TOKEN cannot push to another repository.

on:
  push:
    branches:
      - main
    tags:
      # `<anything>-<digit>...` — matches every package without naming one.
      # A tag like `v1.0` or `nightly` does not match and starts no run at all.
      - '*-[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. lsim-0.1.0). Leave empty to only sync branches.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------- #
  # Discover the packages, and work out what we are doing: a plain branch sync, or
  # a release of one package.
  # ---------------------------------------------------------------------------- #
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
      is_release: ${{ steps.target.outputs.is_release }}
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      mirror: ${{ steps.target.outputs.mirror }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Discover packages
        id: discover
        run: |
          set -euo pipefail

          PACKAGES="$(php bin/packages.php --json)"

          echo "Found: $PACKAGES"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Resolve the release target
        id: target
        env:
          PACKAGES: ${{ steps.discover.outputs.packages }}
        run: |
          set -euo pipefail

          TAG=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag || '' }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "No tag: branch sync only."
            {
              echo "is_release=false"
              echo "package="
              echo "version="
              echo "tag="
              echo "mirror="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # <package>-<semver>, e.g. lsim-0.1.0 or core-1.0.0-beta.1
          if [[ ! "$TAG" =~ ^([a-z0-9-]+)-([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Tag '$TAG' is not in <package>-<version> form (e.g. lsim-0.1.0)."
            exit 1
          fi

          PACKAGE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"

          # The tag prefix must name a discovered package. This catches a typo
          # (`lsimm-0.1.0`) before anything is pushed anywhere.
          MIRROR="$(jq -r --arg d "$PACKAGE" '.[] | select(.directory == $d) | .mirror' <<< "$PACKAGES")"

          if [[ -z "$MIRROR" ]]; then
            echo "::error::Tag '$TAG' names package '$PACKAGE', which is not published from this repo."
            echo "Known packages:"
            jq -r '.[] | "  - " + .directory' <<< "$PACKAGES"
            exit 1
          fi

          {
            echo "is_release=true"
            echo "package=$PACKAGE"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "mirror=$MIRROR"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing '$PACKAGE' version '$VERSION' (tag: $TAG) into $MIRROR."

  # ---------------------------------------------------------------------------- #
  # Release guards. Everything here is a reason NOT to publish.
  # ---------------------------------------------------------------------------- #
  verify:
    name: Verify release
    needs: resolve
    if: needs.resolve.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${{ needs.resolve.outputs.tag }} is not an ancestor of main; refusing to publish an unmerged commit."
            exit 1
          fi
          echo "OK: tag is reachable from main."

      - name: CHANGELOG documents this version
        run: |
          # Composer takes the version from the Git tag, so unlike Python there is
          # no version field in composer.json to cross-check. The CHANGELOG entry is
          # the equivalent guard against tagging something you never wrote up.
          FILE="packages/${{ needs.resolve.outputs.package }}/CHANGELOG.md"
          VERSION="${{ needs.resolve.outputs.version }}"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::$FILE not found."
            exit 1
          fi

          if ! grep -qF "[$VERSION]" "$FILE"; then
            echo "::error::$FILE has no '[$VERSION]' entry. Add the changelog entry before tagging."
            exit 1
          fi
          echo "OK: $FILE documents $VERSION."

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Packages are consistent
        # Directory/name/mirror agree, no package declares a `version` field, and the
        # root autoload map matches what is on disk.
        run: php bin/packages.php --check

      - name: Validate every composer.json
        run: |
          composer validate --strict --no-check-publish
          for f in packages/*/composer.json; do
            echo "--- $f"
            composer validate --strict --no-check-publish "$f"
          done

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: composer run lint

      - name: Static analysis
        run: composer run type-check

      - name: Tests
        run: composer run test

  # ---------------------------------------------------------------------------- #
  # Push each package into its mirror repository.
  #
  # On a branch push this only syncs `main` on the mirrors. On a release it also
  # pushes the version tag, and that tag is what Packagist turns into a version.
  #
  # The matrix comes from `bin/packages.php`, so this needs no edit when a package
  # is added.
  # ---------------------------------------------------------------------------- #
  split:
    name: "Split ${{ matrix.package.directory }}"
    needs: [resolve, verify]
    # `always()` so branch syncs still run when `verify` was skipped, but we still
    # stop if verify actually failed.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.resolve.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.is_release == 'true' && needs.resolve.outputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Sync the mirror's main branch. Runs for every package on every push, so the
      # mirrors always reflect the monorepo even between releases.
      - name: Sync branch
        if: needs.resolve.outputs.is_release != 'true'
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package.directory }}'
          repository_organization: 'integrify-sdk'
          repository_name: '${{ matrix.package.mirror }}'
          branch: 'main'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # Release: only the package named in the tag gets the version tag pushed.
      - name: Split and tag release
        if: >-
          needs.resolve.outputs.is_release == 'true' &&
          needs.resolve.outputs.package == matrix.package.directory
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package.directory }}'
          repository_organization: 'integrify-sdk'
          repository_name: '${{ matrix.package.mirror }}'
          branch: 'main'
          # Note: the version only, without the `core-` / `lsim-` prefix.
          tag: '${{ needs.resolve.outputs.version }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # ---------------------------------------------------------------------------- #
  # Nudge Packagist. Optional: if the mirrors have the Packagist GitHub webhook
  # installed, they update on their own within a minute and this is a no-op.
  # ---------------------------------------------------------------------------- #
  notify:
    name: Notify Packagist
    needs: [resolve, split]
    if: needs.resolve.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          # Resolved from the package's own manifest — no per-package branch here.
          MIRROR: ${{ needs.resolve.outputs.mirror }}
        run: |
          if [[ -z "${PACKAGIST_TOKEN:-}" ]]; then
            echo "PACKAGIST_TOKEN not set — relying on the Packagist webhook on the mirror repository."
            exit 0
          fi

          curl -sSf -XPOST \
            -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/integrify-sdk/${MIRROR}\"}}"
