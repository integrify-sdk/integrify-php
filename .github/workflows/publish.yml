name: Publish

# Publishing PHP packages works nothing like PyPI.
#
# The standard way (Symfony, Laravel, Filament all do this) is a "subtree split":
# CI copies each package directory into its own read-only mirror repository, where
# its composer.json sits at the root. Those mirrors are what Packagist watches.
#
#   integrify-php (this repo, where you work)
#   ├── packages/core  ──split──▶  integrify-sdk/integrify-core-php  ──▶ integrify/core
#   └── packages/lsim  ──split──▶  integrify-sdk/integrify-lsim-php  ──▶ integrify/lsim
#
# `bin/packages.php` discovers them from
# `packages/*/composer.json`, so adding an integration needs no edit to this file.
# The naming convention is:
#
#   packages/lsim/  ->  integrify/lsim  ->  integrify-sdk/integrify-lsim-php
#
# To override a mirror name or keep a package unpublished, put it in that package's
# own composer.json:
#
#   "extra": {"integrify": {"mirror": "other-name", "publish": false}}
#
# The release's tag name says which package and which version:
#
#   <package>-<x.y.z>
#
#   core-0.1.0    -> publishes integrify/core   0.1.0
#   lsim-0.1.0    -> publishes integrify/lsim   0.1.0
#   epoint-0.1.0  -> publishes integrify/epoint 0.1.0
#
#
# Only the package named in the tag is touched. The other mirrors are left exactly as
# they are, which means a mirror's `main` moves only on that package's own releases.
#
# SETUP, once per package:
#
#   1. Create the mirror repo under `integrify-sdk`, and TICK "Add a README file".
#      It must not be a zero-commit repo: the split action runs `git checkout main`,
#      then on failure `git checkout -b main` and straight away `git push origin main`
#      — on an unborn branch there is nothing for `main` to point at, so the push dies
#      with `error: src refspec main does not match any`. Any one commit is enough;
#      the split replaces the whole working tree on the first run anyway.
#   2. Submit the mirror to packagist.org once.
#
# And once for the whole repo: a secret `SPLIT_TOKEN` with `Contents: Read and write`
# on the mirrors only. The default GITHUB_TOKEN cannot push to another repository,
# whatever you put in `permissions:`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. epoint-0.1.0). Must already exist.'
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------- #
  # Work out which package the release names, and where it has to be pushed.
  # ---------------------------------------------------------------------------- #
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      mirror: ${{ steps.target.outputs.mirror }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Resolve the release target
        id: target
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"

          if [[ -z "$TAG" ]]; then
            echo "::error::No tag to publish. A release must carry a tag name."
            exit 1
          fi

          echo "Tag: $TAG"

          # <package>-<semver>, e.g. lsim-0.1.0 or core-1.0.0-beta.1
          if [[ ! "$TAG" =~ ^([a-z0-9-]+)-([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Tag '$TAG' is not in <package>-<version> form (e.g. lsim-0.1.0)."
            exit 1
          fi

          PACKAGE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"

          # The tag prefix must name a package this repo actually publishes. This is
          # what catches a typo (`lsimm-0.1.0`) before anything is pushed anywhere,
          # and it is also why the root `integrify-1.0.0` form has no meaning here:
          # unlike the Python repo, this monorepo publishes no umbrella package.
          PACKAGES="$(php bin/packages.php --json)"
          MIRROR="$(jq -r --arg d "$PACKAGE" '.[] | select(.directory == $d) | .mirror' <<< "$PACKAGES")"

          if [[ -z "$MIRROR" ]]; then
            echo "::error::Tag '$TAG' names package '$PACKAGE', which is not published from this repo."
            echo "Known packages:"
            jq -r '.[] | "  - " + .directory' <<< "$PACKAGES"
            exit 1
          fi

          {
            echo "package=$PACKAGE"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "mirror=$MIRROR"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing '$PACKAGE' version '$VERSION' (tag: $TAG) into $MIRROR."

  # ---------------------------------------------------------------------------- #
  # Release guards. Everything here is a reason NOT to publish.
  #
  # These run against the tag, not against main, because the tag is what ships.
  # ---------------------------------------------------------------------------- #
  verify:
    name: Verify release
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${{ needs.resolve.outputs.tag }} is not an ancestor of main; refusing to publish an unmerged commit."
            exit 1
          fi
          echo "OK: tag is reachable from main."

      - name: CHANGELOG documents this version
        run: |
          # Composer takes the version from the Git tag, so unlike Python there is
          # no version field in composer.json to cross-check. The CHANGELOG entry is
          # the equivalent guard against tagging something you never wrote up.
          FILE="packages/${{ needs.resolve.outputs.package }}/CHANGELOG.md"
          VERSION="${{ needs.resolve.outputs.version }}"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::$FILE not found."
            exit 1
          fi

          if ! grep -qF "[$VERSION]" "$FILE"; then
            echo "::error::$FILE has no '[$VERSION]' entry. Add the changelog entry before releasing."
            exit 1
          fi
          echo "OK: $FILE documents $VERSION."

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Packages are consistent
        # Directory/name/mirror agree, no package declares a `version` field, and the
        # root autoload map matches what is on disk.
        run: php bin/packages.php --check

      - name: Validate every composer.json
        run: |
          composer validate --strict --no-check-publish
          for f in packages/*/composer.json; do
            echo "--- $f"
            composer validate --strict --no-check-publish "$f"
          done

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: composer run lint

      - name: Static analysis
        run: composer run type-check

      - name: Tests
        run: composer run test

  # ---------------------------------------------------------------------------- #
  # Push the released package into its mirror, and tag it there.
  #
  # That mirror tag is what Packagist turns into a published version.
  # ---------------------------------------------------------------------------- #
  split:
    name: "Split ${{ needs.resolve.outputs.package }} ${{ needs.resolve.outputs.version }}"
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Split and tag release
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: 'packages/${{ needs.resolve.outputs.package }}'
          repository_organization: 'integrify-sdk'
          repository_name: '${{ needs.resolve.outputs.mirror }}'
          branch: 'main'
          # Note: the version only, without the `core-` / `lsim-` prefix.
          tag: '${{ needs.resolve.outputs.version }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # ---------------------------------------------------------------------------- #
  # Nudge Packagist. Optional: if the mirror has the Packagist GitHub webhook
  # installed, it updates on its own within a minute and this is a no-op.
  # ---------------------------------------------------------------------------- #
  notify:
    name: Notify Packagist
    needs: [resolve, split]
    runs-on: ubuntu-latest
    steps:
      - name: Ping Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          MIRROR: ${{ needs.resolve.outputs.mirror }}
        run: |
          if [[ -z "${PACKAGIST_TOKEN:-}" ]]; then
            echo "PACKAGIST_TOKEN not set — relying on the Packagist webhook on the mirror repository."
            exit 0
          fi

          curl -sSf -XPOST \
            -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/integrify-sdk/${MIRROR}\"}}"
