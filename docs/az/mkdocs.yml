# Integrify (PHP) sənədləri.
#
# Python tərəfdəki konfiqurasiya ilə eyni tema və eyni markdown genişlənmələri —
# iki sayt eyni görünsün deyə. Fərq bir yerdədir: `mkdocstrings` yoxdur, çünki
# onun PHP handler-i yoxdur (rəsmi siyahı: C, Crystal, GitHub Actions, Python,
# MATLAB, TypeScript, VBA, shell). API referansını `bin/docs.php` qurur.
#
# Yerli işə salmaq — `mkdocs` **bu qovluqdan** çağırılmalıdır, çünki
# `pymdownx.snippets`-in `base_path`-i işçi qovluğa nisbətəndir, konfiqurasiya
# faylına yox (Python repolarındakı `paths: ../../src` də eyni qaydadadır):
#
#     pip install -r docs/az/requirements.txt
#     composer docs
#     cd docs/az && mkdocs serve
#
# Yayımlanma Netlify-dadır: repo kökündəki `netlify.toml` `base`-i `docs/az` qoyur,
# yəni build eyni işçi qovluqdan qaçır. Sayt yalnız `main`-ə push-dan sonra dəyişir;
# PR-lər öz müvəqqəti URL-ində "deploy preview" alır.
site_name: Integrify (PHP)
site_description: Azərbaycan servislərinin API inteqrasiyaları üçün PHP kitabxanaları.
site_author: Miradil Zeynalli
site_url: https://integrify-php.mmzeynalli.dev/
copyright: Copyright © 2026 Miradil Zeynalli. Bütün hüquqlar qorunur.

repo_name: integrify-sdk/integrify-php
repo_url: https://github.com/integrify-sdk/integrify-php
edit_uri: edit/main/docs/az/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: az
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Qaranlıq rejimə keç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: İşıqlı rejimə keç

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      line_spans: __span
  - pymdownx.inlinehilite
  # Paketlərin giriş səhifəsi README-nin özüdür: mətn iki yerdə saxlanılmır.
  # `base_path` repo kökünə baxır, `check_paths` isə itmiş faylı xəta edir —
  # əks halda səhifə səssizcə boş çıxardı.
  - pymdownx.snippets:
      base_path:
        - ../..
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# >>> bin/docs.php
